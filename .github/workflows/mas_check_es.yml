# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
  pull_request:
    branches: [ content ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    name: ci_build

    # The type of runner that the job will run on
    runs-on: ubuntu-22.04

    env:
      SDL_AUDIODRIVER: dummy # handles ALSA issues

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v2

      # Check if changes are within the Monika After Story folder
      - name: Path Filter
        id: filter
        uses: dorny/paths-filter@v2
        with:
          filters: |
            mas:
              - 'Monika After Story/**'

      - name: Setup Python 2.7 (Legacy)
        if: steps.filter.outputs.mas == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y python2-minimal
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      # get/dl renpy src
      - name: cache rpy source
        if: steps.filter.outputs.mas == 'true'
        id: cache-rpy
        uses: actions/cache@v3
        with:
            path: renpy/
            key: ${{ runner.os }}-rpy

      - name: Download rpy source
        if: steps.filter.outputs.mas == 'true' && steps.cache-rpy.outputs.cache-hit != 'true'
        run: |
          wget https://www.renpy.org/dl/6.99.12.4/renpy-6.99.12.4-sdk.tar.bz2
          tar xf renpy-6.99.12.4-sdk.tar.bz2
          rm renpy-6.99.12.4-sdk.tar.bz2
          mv renpy-6.99.12.4-sdk renpy

      # get/download base mas
      - name: cache base MAS
        if: steps.filter.outputs.mas == 'true'
        id: cache-mas
        uses: actions/cache@v3
        with:
            path: mas0105/
            key: ${{ runner.os }}-mas

      - name: Download base MAS
        if: steps.filter.outputs.mas == 'true' && steps.cache-mas.outputs.cache-hit != 'true'
        run: |
          wget https://s3-us-west-2.amazonaws.com/monika-after-story/ddlc/mas.zip
          mkdir mas0105
          unzip mas.zip -d mas0105

      # TEMP
      #      - name: what are these
      #  run: |
      #    file mas0105
      #    file renpy

      # copy files over
      - name: copy source over
        if: steps.filter.outputs.mas == 'true'
        run: cp -Rf Monika\ After\ Story/* mas0105/

      # touch file for unstable so it doesn't raise exceptions for some things
      - name: exception skip for unstable
        if: steps.filter.outputs.mas == 'true' && github.ref == 'refs/heads/unstable'
        run: touch mas0105/trb

      # run sprite checkers
      - name: check sprites
        if: steps.filter.outputs.mas == 'true'
        run: python tools/ghactions.py

      # lint renpy
      - name: rpy lint
        if: steps.filter.outputs.mas == 'true'
        run: |
          cd renpy
          ./renpy.sh "../mas0105/" lint | grep -E -v "^$|Could not find image \(monika [0-9][^[:space:]]+ corresponding to attributes on say statement\.|'monika [0-9][^[:space:]]+' is not an image\.|The image named 'monika [0-9][^[:space:]]+ was not declared\."

      # distribute
      - name: rpy distribute
        if: steps.filter.outputs.mas == 'true'
        run: |
          cd renpy
          ./renpy.sh launcher distribute "../mas0105/" --package Mod
